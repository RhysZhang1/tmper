[package]
name = "termusic"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A terminal-native music player for Arch Linux"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = "0.28"
rodio = "0.20"
symphonia = { version = "0.5", features = ["all"] }
lofty = "0.22"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "2"
dirs = "6"
