[package]
name = "tmper"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A terminal-native music player for Arch Linux"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
rodio = "0.20"
symphonia = { version = "0.5", features = ["all"] }
lofty = "0.22"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "2"
dirs = "6"

rand = "0.8"
walkdir = "2"
regex = "1"
rustfft = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
encoding_rs = "0.8"
unicode-width = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22.1"
