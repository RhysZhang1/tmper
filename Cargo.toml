[package]
name = "tmper"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A terminal-native music player for Arch Linux"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
ratatui = "0.29"
crossterm = "0.28"
rodio = "0.20"
symphonia = { version = "0.5", features = ["all"] }
lofty = "0.22"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
dirs = "6"

rand = "0.8"
walkdir = "2"
regex = "1"
rustfft = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
encoding_rs = "0.8"
unicode-width = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22.1"
# SIXEL encoding in-process (pure Rust, MIT/Apache-2.0). Replaced the `chafa`
# subprocess: the raster is now exactly the pixel box we ask for instead of a
# second program's guess at the cell size, and it is ~7x faster. See
# progress/2026-10-03-encoder-and-terminal-compat.md.
icy_sixel = "0.5"
# poll(2) for the terminal cell-size probe: waiting on the tty *without*
# consuming from it is the whole point, and std has no timeout-aware read.
libc = "0.2"
# MPRIS2, so Plasma's media widget and the media keys can drive the daemon.
# Server-side only, over zbus (already the D-Bus stack on this machine); the
# `tokio` feature is required because the daemon's runtime is tokio's, not
# zbus's default async-io. Its absence is not an error — no session bus, no
# widget, music carries on (see `player/mpris.rs`).
mpris-server = { version = "0.10.0", features = ["tokio"] }
