name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rodio → cpal → alsa-sys links against libasound at build time.
      # The ubuntu runner doesn't ship the ALSA dev headers/so, so every
      # job that compiles the crate fails without this.
      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo check --workspace --all-features

  test:
    name: Device-free tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --workspace --all-features

  audio-output-test:
    name: Audio output tests (virtual ALSA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # Only explicitly ignored audio-output tests receive a virtual device.
      - name: Provide null audio device
        run: printf 'pcm.!default { type null }\nctl.!default { type null }\n' > ~/.asoundrc
      - run: cargo test --workspace --all-features audio_output_ -- --ignored --test-threads=1

  smoke:
    name: Real daemon, CLI, TUI and crash recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audio and private bus dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config dbus
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --locked
      - run: dbus-run-session -- python3 scripts/smoke_test.py target/debug/tmper

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      # `--all-targets` includes the test code. Without it, lints in test
      # modules were never checked and a dozen of them had accumulated.
      - run: cargo clippy --all-targets --workspace --all-features -- -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Headless runners need a null audio device for the audio-dependent tests.
      - name: Provide null audio device
        run: printf 'pcm.!default { type null }\nctl.!default { type null }\n' > ~/.asoundrc
      # Reporting only for now — no --fail-under-lines gate until coverage rises.
      - run: cargo llvm-cov --workspace --all-features
